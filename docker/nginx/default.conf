server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Адрес php-fpm подставляется ПЕРЕМЕННОЙ, и рядом стоит resolver docker
    # (127.0.0.11). Со статическим `fastcgi_pass app:9000` nginx
    # резолвит имя один раз при старте и запоминает IP, а после
    # `docker compose up -d` контейнер app пересоздаётся с НОВЫМ
    # адресом — и сервис отвечает 502 «connect() failed» до перезапуска
    # nginx (ловилось на проде 15.11.2026: АИС лёг после правки .env).
    # С переменной имя резолвится на каждый запрос.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
