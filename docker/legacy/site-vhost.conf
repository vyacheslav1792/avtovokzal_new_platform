<VirtualHost *:80>
    # Сайт avtovokzal57 (публичный). Боевой .htaccess игнорируем (Deny/charset) — локально открываем.
    DocumentRoot /var/www/html/avtovokzal57
    DirectoryIndex index.php index.html
    <Directory /var/www/html/avtovokzal57>
        AllowOverride None
        Require all granted
        # «Красивые» URL: index.php сам парсит REQUEST_URI (/buy, /raspisanie-avtobusov и т.п.).
        # Несуществующие файлы направляем на index.php (аналог боевого rewrite, но без redirect на домен).
        FallbackResource /index.php
    </Directory>
    AddDefaultCharset UTF-8
</VirtualHost>
