; Legacy PHP 5.6 (сверка). Глобально подключаем odbc-shim (odbc_* -> нативный Firebird).
auto_prepend_file = /var/www/html/odbc-shim.php

memory_limit = 512M
max_execution_time = 300
date.timezone = Europe/Moscow

; legacy-код шумит нотисами — показываем только значимое
display_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT & ~E_WARNING
