; Настройки PHP для разработки
memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = Europe/Moscow

; Показывать ошибки В КОНСОЛИ (artisan, разовые скрипты): туда их читает
; человек, который команду и запустил.
;
; В ВЕБ-ОТВЕТЕ показ ошибок выключен — его перекрывает `php_admin_flag` в
; docker/php/pool.conf (переменная PHP_DISPLAY_ERRORS, по умолчанию off):
; покупателю незачем видеть путь к файлу, строку и кусок кода. Ошибки от
; этого не теряются, они идут в error_log — в stderr контейнера.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; ЗАПИСЬ ошибок PHP в журнал. Обязательна и важнее показа: в образе
; php:8.5-fpm своего php.ini нет, действуют встроенные умолчания, а там
; `log_errors = 0` — то есть фатальные ошибки PHP (падение при компиляции
; файла, нехватка памяти, сбой расширения) НЕ ПОПАДАЛИ НИКУДА: в вебе их
; видел покупатель в ответе, и больше их не видел никто. С выключенным
; показом они бы просто исчезали.
;
; `error_log` оставляем пустым СОЗНАТЕЛЬНО: тогда PHP отдаёт ошибку
; журналу SAPI, то есть php-fpm, а тот пишет её в stderr контейнера —
; `docker compose logs app`. Отдельный файл пришлось бы ещё и ротировать.
log_errors = On

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
