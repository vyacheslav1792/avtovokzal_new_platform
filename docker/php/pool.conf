; Пул php-fpm: сколько запросов приложение обрабатывает одновременно.
;
; Монтируется как /usr/local/etc/php-fpm.d/zzz-pool.conf — имя на `zzz`,
; потому что конфиги подключаются по маске `*.conf` в алфавитном порядке,
; и переопределить www.conf из образа может только файл после него.
;
; ЗАЧЕМ ЭТОТ ФАЙЛ. В образе php:8.5-fpm стоит `pm.max_children = 5`, и это
; было узким местом: один обработчик backend занимает 50–56 МБ, то есть
; потолок пула — 280 МБ при 15 ГБ памяти на сервере, зато ПЯТИ
; одновременных запросов хватало, чтобы приложение перестало отвечать
; всем. 16.11.2026 так и вышло: запросы к недоступным станциям держались
; по 21–120 секунд, заняли все пять обработчиков backend и sales-api, и
; сайт отдавал «Server Error» даже там, где станции не нужны, а письма о
; покупке уходили без PDF билетов — gotenberg не мог получить печатную
; форму.
;
; Сколько обработчиков у какого приложения — переменная
; PHP_FPM_MAX_CHILDREN в docker-compose.yml: у сайта и API продаж запросов
; на порядок больше, чем у АИС и фискальной прослойки.

[www]

pm = dynamic

; Потолок одновременных запросов. Память берётся не сразу: при `dynamic`
; живёт столько обработчиков, сколько нужно под текущую нагрузку.
pm.max_children = ${PHP_FPM_MAX_CHILDREN}

; Запас на старте и в простое — одинаковый для всех приложений: он про
; «не ждать форка на первом запросе», а не про предельную нагрузку.
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Обработчик перезапускается после 500 запросов: страховка от утечек
; памяти в долгоживущем процессе (в образе стоит 0 — не перезапускать
; никогда).
pm.max_requests = 500
