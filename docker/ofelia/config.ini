; Задания планировщика ofelia (TZ контейнера — Europe/Moscow).
; Формат schedule — Go cron с секундами: сек мин час день месяц день-недели.

[job-exec "KKT nightly Z-report"]
schedule = 0 59 23 * * *
container = avtovokzal-kkm-app
user = www-data
command = php /var/www/html/artisan kkm:close-shift

; Регулярное расписание станций для страницы /raspisanie-avtobusov:
; в legacy его перезаписывали вручную кнопкой (getrasp.php?action=raspisanie).
[job-exec "Station schedules sync"]
schedule = 0 15 4 * * *
container = avtovokzal-app
user = www-data
command = php /var/www/html/artisan schedule:sync

; Чистка токенов кабинета без активности (полгода) и просроченных
; ссылок из писем — таблицы не должны расти бесконечно.
[job-exec "Cabinet tokens cleanup"]
schedule = 0 30 4 * * *
container = avtovokzal-app
user = www-data
command = php /var/www/html/artisan auth:prune-tokens
