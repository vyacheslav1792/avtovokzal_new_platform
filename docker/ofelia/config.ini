; Задания планировщика ofelia (TZ контейнера — Europe/Moscow).
; Формат schedule — Go cron с секундами: сек мин час день месяц день-недели.

[job-exec "KKT nightly Z-report"]
schedule = 0 59 23 * * *
container = avtovokzal-kkm-app
user = www-data
command = php /var/www/html/artisan kkm:close-shift

; Регулярное расписание станций для страницы /raspisanie-avtobusov:
; в legacy его перезаписывали вручную кнопкой (getrasp.php?action=raspisanie).
[job-exec "Station schedules sync"]
schedule = 0 15 4 * * *
container = avtovokzal-app
user = www-data
command = php /var/www/html/artisan schedule:sync

; Пункты назначения станций (список «Куда» на форме поиска). Дважды утром:
; до начала продаж и в середине утра — правка на станции доезжает до сайта
; в тот же день. Неудачный запрос прежний список НЕ стирает (см.
; DestinationService), поэтому второй прогон заодно подстраховывает первый.
[job-exec "Station destinations sync (morning)"]
schedule = 0 0 7 * * *
container = avtovokzal-app
user = www-data
command = php /var/www/html/artisan destinations:sync

[job-exec "Station destinations sync (late morning)"]
schedule = 0 0 10 * * *
container = avtovokzal-app
user = www-data
command = php /var/www/html/artisan destinations:sync

; Чистка токенов кабинета без активности (полгода) и просроченных
; ссылок из писем — таблицы не должны расти бесконечно.
[job-exec "Cabinet tokens cleanup"]
schedule = 0 30 4 * * *
container = avtovokzal-app
user = www-data
command = php /var/www/html/artisan auth:prune-tokens

; Брошенные покупки: деньги списаны, билетов нет — покупатель не вернулся
; на сайт после оплаты. Перенос legacy avtovokzal57/refund.php, который
; крутился по расписанию. Билеты за покупателя НЕ оформляем, только
; возвращаем деньги; срок — config/orders.php (час по умолчанию).
[job-exec "Abandoned orders refund"]
schedule = 0 */15 * * * *
container = avtovokzal-app
user = www-data
command = php /var/www/html/artisan orders:cancel-abandoned

; Мёртвые сессии сотрудников АИС. Истёкшая сессия и так не пускает (срок
; проверяется при каждом запросе), но строки копятся — по одной на каждый
; вход с каждой машины.
[job-exec "AIS employee tokens cleanup"]
schedule = 0 35 4 * * *
container = avtovokzal-ais-app
user = www-data
command = php /var/www/html/artisan ais:prune-tokens
