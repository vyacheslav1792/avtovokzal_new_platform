# Окружение разработки новой платформы АИС.
# Только bind mounts (точки монтирования), без именованных томов.
# Прод-специфику вынесем позже в docker-compose.prod.yml.

# Ротация журналов контейнеров (`docker compose logs`). Нужна потому, что
# драйвер json-file по умолчанию не ограничен ничем: на проде эти файлы
# набрали 295 МБ, крупнейший — 176 МБ. Значение этих журналов выросло:
# ошибки PHP, не дошедшие до Laravel (падение при компиляции файла,
# нехватка памяти), пишутся именно туда — см. docker/php/php.ini.
# Задано у сервисов, а не в /etc/docker/daemon.json, чтобы не
# перезапускать демон docker со всеми чужими контейнерами.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    logging: *logging
    image: postgres:17
    # Сервер живёт в московском времени, как и станции: `now()`, журнал и
    # вывод timestamptz в psql — в +3, а не в UTC. Каждое приложение при этом
    # ЯВНО фиксирует пояс сессии в своём config/database.php (backend и
    # ais-api — Europe/Moscow, sales-api и kkm-api — UTC), поэтому смена
    # умолчания сервера ничего не сдвигает: Eloquent пишет даты строкой без
    # смещения, и пояс сессии здесь решает всё.
    command:
      - postgres
      - -c
      - timezone=Europe/Moscow
      - -c
      - log_timezone=Europe/Moscow
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Firebird 2.5 для разработки: восстановленные бэкапы наших баз (ais, site)
  # и одной вендорной базы продаж (Красная Заря / BUSTER). Файлы .fbk/.fdb — в ./databases.
  firebird:
    logging: *logging
    # Свой Dockerfile: aliases.conf кладётся в скелет конфигов образа. Монтировать
    # его в /firebird/etc нельзя — так каталог создаётся заранее, и entrypoint
    # не раскладывает туда firebird.conf с SYSDBA.password (см. docker/firebird/Dockerfile).
    build:
      context: ./docker/firebird
    environment:
      ISC_PASSWORD: ${FB_PASSWORD:-masterkey}
      EnableLegacyClientAuth: "true"
      TZ: Europe/Moscow
    ports:
      - "${FB_PORT:-3050}:3050"
    volumes:
      # /firebird объявлен VOLUME в образе: без явного монтирования docker заводит
      # анонимный том (мы такие не используем) и таскает его при пересоздании
      # контейнера — вместе с испорченным /firebird/etc. Держим состояние сервера
      # (etc, system/security2.fdb, log) в ./data/firebird, базы — в ./databases.
      - ./data/firebird:/firebird
      - ./databases:/firebird/data

  # Legacy-окружение (сверка): PHP 5.6 + Apache, боевой код из ./htdocs.
  # db_work работает через odbc-shim -> нативный Firebird (локальный контейнер).
  legacy:
    logging: *logging
    build:
      context: ./docker/legacy
    ports:
      - "${LEGACY_PORT:-8090}:80"
    volumes:
      - ./htdocs:/var/www/html
      - ./docker/legacy/odbc-shim.php:/var/www/html/odbc-shim.php:ro
      - ./docker/legacy/php-legacy.ini:/usr/local/etc/php/conf.d/zz-legacy.ini:ro
    environment:
      FB_HOST: firebird
      FB_USER: SYSDBA
      FB_PASSWORD: ${FB_PASSWORD:-masterkey}
      TZ: Europe/Moscow
    depends_on:
      - firebird

  # Legacy-сайт avtovokzal57 (тот же образ/шим, но DocumentRoot = сайт).
  legacy_site:
    logging: *logging
    build:
      context: ./docker/legacy
    ports:
      - "${LEGACY_SITE_PORT:-8091}:80"
    volumes:
      - ./htdocs:/var/www/html
      - ./docker/legacy/odbc-shim.php:/var/www/html/odbc-shim.php:ro
      - ./docker/legacy/php-legacy.ini:/usr/local/etc/php/conf.d/zz-legacy.ini:ro
      - ./docker/legacy/site-vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
    environment:
      FB_HOST: firebird
      FB_USER: SYSDBA
      FB_PASSWORD: ${FB_PASSWORD:-masterkey}
      TZ: Europe/Moscow
    depends_on:
      - firebird

  app:
    logging: *logging
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: avtovokzal-app # стабильное имя для job-exec ofelia
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      # Каталог модулей и прав АИС (shared/ais_permissions.php): backend
      # проверяет по нему права сотрудника на своих /api/v1/admin/*.
      - ./shared:/var/www/shared:ro
      # Файлы страниц сайта (PDF документов, плакаты): в legacy лежали
      # в avtovokzal57/docs и заливались по FTP, теперь их грузит админка.
      - ./data/uploads:/var/www/uploads
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      # Потолок одновременных запросов — см. docker/php/pool.conf
      - ./docker/php/pool.conf:/usr/local/etc/php-fpm.d/zzz-pool.conf:ro
    environment:
      # Одновременных запросов: у сайта их больше всех — поиск рейсов,
      # оформление, печать, возвраты (см. docker/php/pool.conf)
      PHP_FPM_MAX_CHILDREN: 24
      # Показ ошибок PHP в веб-ответе (см. docker/php/pool.conf);
      # по умолчанию выключен, включается в корневом .env
      PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-off}
      # Подключение Laravel к Postgres (сервис db)
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Публичный адрес сайта — из корневого .env (SITE_URL), одно место на
      # весь монорепо. ВАЖНО: переменная окружения контейнера ПЕРЕКРЫВАЕТ
      # значение из backend/.env — Dotenv не перезаписывает уже заданные
      # переменные. Править адрес нужно в SITE_URL, не в backend/.env.
      FRONTEND_URL: "${SITE_URL:-http://127.0.0.1:3000}"
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy

  # Обработчик очередей backend: фискальные чеки и письма покупателям.
  #
  # Раньше его запускали руками (`queue:work --stop-when-empty`), и на
  # проде это стоило чеков: заказ оформлялся, задача ложилась в `jobs` и
  # висела там, пока кто-нибудь не вспомнит (ловилось 15.11.2026 —
  # у четырёх оплаченных заказов не было фискального признака).
  # Чек по 54-ФЗ обязан уйти сам, поэтому воркер — обычный сервис.
  #
  # `--max-time=3600` — перезапуск раз в час: Laravel-воркер держит код в
  # памяти, и после выкладки он иначе продолжал бы работать по старому.
  queue:
    logging: *logging
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: avtovokzal-queue
    working_dir: /var/www/html
    restart: unless-stopped
    command: php artisan queue:work --queue=receipts,emails --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./backend:/var/www/html
      - ./shared:/var/www/shared:ro
      - ./data/uploads:/var/www/uploads
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Тот же публичный адрес, что у app: письма и PDF билетов собираются
      # здесь же (см. ловушку про перекрытие backend/.env у сервиса app).
      FRONTEND_URL: "${SITE_URL:-http://127.0.0.1:3000}"
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy

  web:
    logging: *logging
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8088}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # API продаж — отдельный сервис со своей БД (sales) и своим nginx.
  # Работает автономно от avtovokzal57: только базы автостанций (Firebird) + журнал.
  sales_app:
    logging: *logging
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    volumes:
      - ./sales-api:/var/www/html
      - ./shared:/var/www/shared:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      # Потолок одновременных запросов — см. docker/php/pool.conf
      - ./docker/php/pool.conf:/usr/local/etc/php-fpm.d/zzz-pool.conf:ro
    environment:
      # Одновременных запросов: сюда ходит backend по каждому запросу
      # сайта, плюс агенты напрямую
      PHP_FPM_MAX_CHILDREN: 24
      # Показ ошибок PHP в веб-ответе (см. docker/php/pool.conf);
      # по умолчанию выключен, включается в корневом .env
      PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-off}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sales
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Справочник станций живёт в БД АИС и правится в АИС (таблица
      # `stations`); sales-api читает его прямым запросом — см.
      # App\Services\Buster\StationCatalog.
      AIS_DB_DATABASE: ais
      # Настройка «Ожидание связи с базой станции» правится в АИС и
      # лежит в БД сайта (таблица `settings`) — читаем прямым запросом,
      # см. App\Services\SiteSettings.
      SITE_DB_DATABASE: avtovokzal
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
      firebird:
        condition: service_started

  sales_web:
    logging: *logging
    image: nginx:1.27-alpine
    ports:
      - "${SALES_WEB_PORT:-8085}:80"
    volumes:
      - ./sales-api:/var/www/html:ro
      - ./docker/nginx/sales.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sales_app

  ais_app:
    logging: *logging
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: avtovokzal-ais-app # стабильное имя для job-exec ofelia
    working_dir: /var/www/html
    volumes:
      - ./ais-api:/var/www/html
      - ./shared:/var/www/shared:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      # Потолок одновременных запросов — см. docker/php/pool.conf
      - ./docker/php/pool.conf:/usr/local/etc/php-fpm.d/zzz-pool.conf:ro
      # Журналы остальных приложений — РАЗДЕЛ «ЖУРНАЛЫ» В АИС читает их
      # файлами, read-only. Так не нужно ни ssh с docker exec (сейчас логи
      # смотрят только так), ни отдельного API у каждого сервиса: свои
      # журналы АИС и так видит в storage/logs.
      - ./backend/storage/logs:/var/log/apps/backend:ro
      - ./sales-api/storage/logs:/var/log/apps/sales:ro
      - ./kkm-api/storage/logs:/var/log/apps/kkm:ro
    environment:
      # Одновременных запросов: сотрудников единицы, но отчёты по
      # станциям идут долго
      PHP_FPM_MAX_CHILDREN: 12
      # Показ ошибок PHP в веб-ответе (см. docker/php/pool.conf);
      # по умолчанию выключен, включается в корневом .env
      PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-off}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ais
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SITE_DB_DATABASE: avtovokzal
      # Ссылки «печать билета» в отчётах — тот же SITE_URL (см. сервис app).
      SITE_FRONTEND_URL: "${SITE_URL:-http://127.0.0.1:3000}"
      TZ: Europe/Moscow
    # KkmServer стоит на ХОСТ-машине (не в docker), а АИС проверяет связь
    # с ККТ кнопкой на странице «Фискальный сервер» — без host-gateway
    # host.docker.internal из этого контейнера не резолвится.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      firebird:
        condition: service_started

  ais_web:
    logging: *logging
    image: nginx:1.27-alpine
    ports:
      - "${AIS_WEB_PORT:-8086}:80"
    volumes:
      - ./ais-api:/var/www/html:ro
      - ./docker/nginx/ais.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ais_app

  kkm_app:
    logging: *logging
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: avtovokzal-kkm-app # стабильное имя для job-exec ofelia
    working_dir: /var/www/html
    volumes:
      - ./kkm-api:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      # Потолок одновременных запросов — см. docker/php/pool.conf
      - ./docker/php/pool.conf:/usr/local/etc/php-fpm.d/zzz-pool.conf:ro
    environment:
      # Одновременных запросов: поток чеков ровный и небольшой
      PHP_FPM_MAX_CHILDREN: 8
      # Показ ошибок PHP в веб-ответе (см. docker/php/pool.conf);
      # по умолчанию выключен, включается в корневом .env
      PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-off}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: kkm
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Настройки KkmServer правятся в АИС (таблица `kkm_servers` в БД ais).
      AIS_DB_DATABASE: ais
      TZ: Europe/Moscow
    extra_hosts:
      # KkmServer установлен на хост-машине (не в docker), порт 5893
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Планировщик заданий: исполняет команды в чужих контейнерах через docker.sock
  # (см. docker/ofelia/config.ini) — как в проекте authserver.
  scheduler:
    logging: *logging
    image: mcuadros/ofelia:latest
    environment:
      TZ: Europe/Moscow
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/ofelia/config.ini:/etc/ofelia/config.ini:ro
    depends_on:
      - kkm_app
    restart: unless-stopped

  kkm_web:
    logging: *logging
    image: nginx:1.27-alpine
    ports:
      - "${KKM_WEB_PORT:-8087}:80"
    volumes:
      - ./kkm-api:/var/www/html:ro
      - ./docker/nginx/kkm.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kkm_app

  # Рендер PDF билетов: Chromium за HTTP API. backend отдаёт ему URL печатной
  # формы (http://frontend:3000/print/{id}) и получает готовый PDF — тем же
  # способом, что и legacy pdf.php (wkhtmltopdf по URL print.php).
  # Наружу не публикуем: сервис ходит только по внутренней сети compose.
  gotenberg:
    logging: *logging
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --chromium-allow-list=^https?://(frontend|web):.*
      # Умолчание — 30 с, и его не хватало: 16.11.2026 при пропаже связи
      # со станциями сайт отвечал медленно, рендер печатной формы не
      # укладывался, gotenberg отдавал 503 «The request exceeded the time
      # limit», и письмо о покупке уходило БЕЗ PDF билетов. В норме
      # страница рендерится 1,3 с, так что запас ни на что не влияет.
      - --api-timeout=60s
    environment:
      TZ: Europe/Moscow
    depends_on:
      - frontend

  # HTTPS-вход на локальном контуре (см. docker/caddy/Caddyfile).
  # Нужен для входа через VK ID: VK принимает только https в адресе
  # возврата, и только стандартный порт — поэтому наружу именно 443,
  # а сайт открывается как https://avtovokzal57.local (имя — в /etc/hosts).
  # Отдаёт под одним origin и сайт, и /api/v1/* — иначе https-страница
  # не смогла бы ходить в http-API (mixed content).
  # Сертификат самоподписанный: браузер один раз предупредит.
  proxy:
    logging: *logging
    image: caddy:2-alpine
    ports:
      - "${TLS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Локальный центр сертификации Caddy: без сохранения сертификат
      # менялся бы при каждом рестарте, и браузер ругался бы заново.
      - ./data/caddy:/data
    depends_on:
      - frontend
      - web

  # SPA отчётов АИС (Vue 3 + Vite, dev-сервер).
  ais_spa:
    logging: *logging
    image: node:24-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./ais-spa:/app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 3001"
    ports:
      - "${AIS_SPA_PORT:-3001}:3001"
    environment:
      AIS_API_PROXY: "http://ais_web"
      SITE_API_PROXY: "http://web"
      # Адрес сайта для ссылок из админки (страница контактов).
      VITE_SITE_URL: "${SITE_URL:-http://127.0.0.1:3000}"
    depends_on:
      - ais_web
      - web

  frontend:
    logging: *logging
    image: node:24-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # проксирование/обращение фронта к бэкенду
      NUXT_PUBLIC_API_BASE: "http://localhost:${WEB_PORT:-8088}"
      # публичный адрес сайта для ссылок в билетах (PDF рендерится по
      # внутреннему адресу, origin запроса туда подставлять нельзя) —
      # из корневого .env (SITE_URL), одно место на весь монорепо
      NUXT_PUBLIC_SITE_URL: "${SITE_URL:-http://127.0.0.1:3000}"
      # Клиентский ключ Yandex SmartCaptcha (ysc1_…) для формы обратной
      # связи. Пустой = капчи на форме нет: тестовых ключей у сервиса не
      # бывает, поэтому на локальном контуре она просто выключена
      # (серверный ключ — CAPTCHA_SERVER_KEY в backend/.env).
      NUXT_PUBLIC_CAPTCHA_KEY: "${CAPTCHA_CLIENT_KEY:-}"
      # Станционная система (`/stations/**`) на новую платформу ещё НЕ
      # перенесена: запросы к ней проксируются на старый сайт как есть
      # (server/routes/stations). Домен автовокзал57.рф уже указывает на
      # этот сервер, поэтому без прокси станции получали бы 404.
      # Пусто = прокси выключен (локальный контур).
      NUXT_LEGACY_SITE_PROXY: "${LEGACY_SITE_PROXY:-}"
      NUXT_LEGACY_SITE_HOST: "${LEGACY_SITE_HOST:-}"
      # Версия сайта для людей с нарушениями зрения (ГОСТ Р 52872-2019):
      # кнопка в шапке + панель настроек. `ACCESSIBILITY_VERSION=0` в корневом
      # .env убирает кнопку и всю версию целиком.
      NUXT_PUBLIC_ACCESSIBILITY: "${ACCESSIBILITY_VERSION:-1}"
      # PWA: установка приложения на телефон и работа без сети (купленные
      # билеты). `PWA=0` в корневом .env убирает service worker и кнопку
      # установки целиком. В dev service worker не регистрируется в любом
      # случае — его кэш мешает Vite отдавать свежие бандлы.
      NUXT_PUBLIC_PWA: "${PWA:-1}"
    # Станционная система старого сайта: прокси ходит на неё по ДОМЕННОМУ
    # имени (так совпадают и Host, и SNI, и сертификат), а имя здесь
    # указывает на старый сервер — иначе запрос вернулся бы на нас самих:
    # в DNS этот домен уже ведёт на новый сервер. LEGACY_SITE_IP — адрес
    # старого сервера в локальной сети.
    extra_hosts:
      - "${LEGACY_SITE_HOST:-legacy.invalid}:${LEGACY_SITE_IP:-192.168.2.5}"
