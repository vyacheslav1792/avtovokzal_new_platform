# Окружение разработки новой платформы АИС.
# Только bind mounts (точки монтирования), без именованных томов.
# Прод-специфику вынесем позже в docker-compose.prod.yml.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Firebird 2.5 для разработки: восстановленные бэкапы наших баз (ais, site)
  # и одной вендорной базы продаж (Красная Заря / BUSTER). Файлы .fbk/.fdb — в ./databases.
  firebird:
    image: jacobalberty/firebird:2.5-ss
    environment:
      ISC_PASSWORD: ${FB_PASSWORD:-masterkey}
      EnableLegacyClientAuth: "true"
      TZ: Europe/Moscow
    ports:
      - "${FB_PORT:-3050}:3050"
    volumes:
      - ./databases:/firebird/data
      - ./docker/firebird/aliases.conf:/firebird/etc/aliases.conf

  # Legacy-окружение (сверка): PHP 5.6 + Apache, боевой код из ./htdocs.
  # db_work работает через odbc-shim -> нативный Firebird (локальный контейнер).
  legacy:
    build:
      context: ./docker/legacy
    ports:
      - "${LEGACY_PORT:-8090}:80"
    volumes:
      - ./htdocs:/var/www/html
      - ./docker/legacy/odbc-shim.php:/var/www/html/odbc-shim.php:ro
      - ./docker/legacy/php-legacy.ini:/usr/local/etc/php/conf.d/zz-legacy.ini:ro
    environment:
      FB_HOST: firebird
      FB_USER: SYSDBA
      FB_PASSWORD: ${FB_PASSWORD:-masterkey}
      TZ: Europe/Moscow
    depends_on:
      - firebird

  # Legacy-сайт avtovokzal57 (тот же образ/шим, но DocumentRoot = сайт).
  legacy_site:
    build:
      context: ./docker/legacy
    ports:
      - "${LEGACY_SITE_PORT:-8091}:80"
    volumes:
      - ./htdocs:/var/www/html
      - ./docker/legacy/odbc-shim.php:/var/www/html/odbc-shim.php:ro
      - ./docker/legacy/php-legacy.ini:/usr/local/etc/php/conf.d/zz-legacy.ini:ro
      - ./docker/legacy/site-vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
    environment:
      FB_HOST: firebird
      FB_USER: SYSDBA
      FB_PASSWORD: ${FB_PASSWORD:-masterkey}
      TZ: Europe/Moscow
    depends_on:
      - firebird

  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      # Подключение Laravel к Postgres (сервис db)
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # API продаж — отдельный сервис со своей БД (sales) и своим nginx.
  # Работает автономно от avtovokzal57: только базы автостанций (Firebird) + журнал.
  sales_app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    volumes:
      - ./sales-api:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sales
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
      firebird:
        condition: service_started

  sales_web:
    image: nginx:1.27-alpine
    ports:
      - "${SALES_WEB_PORT:-8085}:80"
    volumes:
      - ./sales-api:/var/www/html:ro
      - ./docker/nginx/sales.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sales_app

  frontend:
    image: node:24-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # проксирование/обращение фронта к бэкенду
      NUXT_PUBLIC_API_BASE: "http://localhost:${WEB_PORT:-8080}"
