# Окружение разработки новой платформы АИС.
# Только bind mounts (точки монтирования), без именованных томов.
# Прод-специфику вынесем позже в docker-compose.prod.yml.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Firebird 2.5 для разработки: восстановленные бэкапы наших баз (ais, site)
  # и одной вендорной базы продаж (Красная Заря / BUSTER). Файлы .fbk/.fdb — в ./databases.
  firebird:
    # Свой Dockerfile: aliases.conf кладётся в скелет конфигов образа. Монтировать
    # его в /firebird/etc нельзя — так каталог создаётся заранее, и entrypoint
    # не раскладывает туда firebird.conf с SYSDBA.password (см. docker/firebird/Dockerfile).
    build:
      context: ./docker/firebird
    environment:
      ISC_PASSWORD: ${FB_PASSWORD:-masterkey}
      EnableLegacyClientAuth: "true"
      TZ: Europe/Moscow
    ports:
      - "${FB_PORT:-3050}:3050"
    volumes:
      # /firebird объявлен VOLUME в образе: без явного монтирования docker заводит
      # анонимный том (мы такие не используем) и таскает его при пересоздании
      # контейнера — вместе с испорченным /firebird/etc. Держим состояние сервера
      # (etc, system/security2.fdb, log) в ./data/firebird, базы — в ./databases.
      - ./data/firebird:/firebird
      - ./databases:/firebird/data

  # Legacy-окружение (сверка): PHP 5.6 + Apache, боевой код из ./htdocs.
  # db_work работает через odbc-shim -> нативный Firebird (локальный контейнер).
  legacy:
    build:
      context: ./docker/legacy
    ports:
      - "${LEGACY_PORT:-8090}:80"
    volumes:
      - ./htdocs:/var/www/html
      - ./docker/legacy/odbc-shim.php:/var/www/html/odbc-shim.php:ro
      - ./docker/legacy/php-legacy.ini:/usr/local/etc/php/conf.d/zz-legacy.ini:ro
    environment:
      FB_HOST: firebird
      FB_USER: SYSDBA
      FB_PASSWORD: ${FB_PASSWORD:-masterkey}
      TZ: Europe/Moscow
    depends_on:
      - firebird

  # Legacy-сайт avtovokzal57 (тот же образ/шим, но DocumentRoot = сайт).
  legacy_site:
    build:
      context: ./docker/legacy
    ports:
      - "${LEGACY_SITE_PORT:-8091}:80"
    volumes:
      - ./htdocs:/var/www/html
      - ./docker/legacy/odbc-shim.php:/var/www/html/odbc-shim.php:ro
      - ./docker/legacy/php-legacy.ini:/usr/local/etc/php/conf.d/zz-legacy.ini:ro
      - ./docker/legacy/site-vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
    environment:
      FB_HOST: firebird
      FB_USER: SYSDBA
      FB_PASSWORD: ${FB_PASSWORD:-masterkey}
      TZ: Europe/Moscow
    depends_on:
      - firebird

  app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: avtovokzal-app # стабильное имя для job-exec ofelia
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      # Файлы страниц сайта (PDF документов, плакаты): в legacy лежали
      # в avtovokzal57/docs и заливались по FTP, теперь их грузит админка.
      - ./data/uploads:/var/www/uploads
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      # Подключение Laravel к Postgres (сервис db)
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # API продаж — отдельный сервис со своей БД (sales) и своим nginx.
  # Работает автономно от avtovokzal57: только базы автостанций (Firebird) + журнал.
  sales_app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    volumes:
      - ./sales-api:/var/www/html
      - ./shared:/var/www/shared:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sales
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
      firebird:
        condition: service_started

  sales_web:
    image: nginx:1.27-alpine
    ports:
      - "${SALES_WEB_PORT:-8085}:80"
    volumes:
      - ./sales-api:/var/www/html:ro
      - ./docker/nginx/sales.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sales_app

  ais_app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /var/www/html
    volumes:
      - ./ais-api:/var/www/html
      - ./shared:/var/www/shared:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ais
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SITE_DB_DATABASE: avtovokzal
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
      firebird:
        condition: service_started

  ais_web:
    image: nginx:1.27-alpine
    ports:
      - "${AIS_WEB_PORT:-8086}:80"
    volumes:
      - ./ais-api:/var/www/html:ro
      - ./docker/nginx/ais.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ais_app

  kkm_app:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: avtovokzal-kkm-app # стабильное имя для job-exec ofelia
    working_dir: /var/www/html
    volumes:
      - ./kkm-api:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: kkm
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Moscow
    extra_hosts:
      # KkmServer установлен на хост-машине (не в docker), порт 5893
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Планировщик заданий: исполняет команды в чужих контейнерах через docker.sock
  # (см. docker/ofelia/config.ini) — как в проекте authserver.
  scheduler:
    image: mcuadros/ofelia:latest
    environment:
      TZ: Europe/Moscow
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/ofelia/config.ini:/etc/ofelia/config.ini:ro
    depends_on:
      - kkm_app
    restart: unless-stopped

  kkm_web:
    image: nginx:1.27-alpine
    ports:
      - "${KKM_WEB_PORT:-8087}:80"
    volumes:
      - ./kkm-api:/var/www/html:ro
      - ./docker/nginx/kkm.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kkm_app

  # Рендер PDF билетов: Chromium за HTTP API. backend отдаёт ему URL печатной
  # формы (http://frontend:3000/print/{id}) и получает готовый PDF — тем же
  # способом, что и legacy pdf.php (wkhtmltopdf по URL print.php).
  # Наружу не публикуем: сервис ходит только по внутренней сети compose.
  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --chromium-allow-list=^https?://(frontend|web):.*
    environment:
      TZ: Europe/Moscow
    depends_on:
      - frontend

  # HTTPS-вход на локальном контуре (см. docker/caddy/Caddyfile).
  # Нужен для входа через VK ID: VK принимает только https в адресе
  # возврата, и только стандартный порт — поэтому наружу именно 443,
  # а сайт открывается как https://avtovokzal57.local (имя — в /etc/hosts).
  # Отдаёт под одним origin и сайт, и /api/v1/* — иначе https-страница
  # не смогла бы ходить в http-API (mixed content).
  # Сертификат самоподписанный: браузер один раз предупредит.
  proxy:
    image: caddy:2-alpine
    ports:
      - "${TLS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Локальный центр сертификации Caddy: без сохранения сертификат
      # менялся бы при каждом рестарте, и браузер ругался бы заново.
      - ./data/caddy:/data
    depends_on:
      - frontend
      - web

  # SPA отчётов АИС (Vue 3 + Vite, dev-сервер).
  ais_spa:
    image: node:24-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./ais-spa:/app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 3001"
    ports:
      - "${AIS_SPA_PORT:-3001}:3001"
    environment:
      AIS_API_PROXY: "http://ais_web"
      SITE_API_PROXY: "http://web"
      # Адрес сайта для ссылок из админки (страница контактов).
      VITE_SITE_URL: "http://127.0.0.1:${FRONTEND_PORT:-3000}"
    depends_on:
      - ais_web
      - web

  frontend:
    image: node:24-alpine
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      # проксирование/обращение фронта к бэкенду
      NUXT_PUBLIC_API_BASE: "http://localhost:${WEB_PORT:-8080}"
      # публичный адрес сайта для ссылок в билетах (PDF рендерится по
      # внутреннему адресу, origin запроса туда подставлять нельзя)
      NUXT_PUBLIC_SITE_URL: "http://127.0.0.1:${FRONTEND_PORT:-3000}"
      # Клиентский ключ Yandex SmartCaptcha (ysc1_…) для формы обратной
      # связи. Пустой = капчи на форме нет: тестовых ключей у сервиса не
      # бывает, поэтому на локальном контуре она просто выключена
      # (серверный ключ — CAPTCHA_SERVER_KEY в backend/.env).
      NUXT_PUBLIC_CAPTCHA_KEY: "${CAPTCHA_CLIENT_KEY:-}"
